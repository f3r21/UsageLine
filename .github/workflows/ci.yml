name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Lint hook scripts
        run: bash -n scripts/statusline-indicator.sh && bash -n scripts/install-hook.sh && bash -n scripts/uninstall-hook.sh && bash -n scripts/install.command

      - name: Build (release)
        run: swift build -c release

      - name: Assemble app bundle
        run: make build

      - name: Package DMG (also exercises the install.command packaging step)
        run: make dmg
